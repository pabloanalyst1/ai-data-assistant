name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    # No API key here on purpose: every test uses a scripted or offline LLM
    env:
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (SQL guard, assistant loop, eval scorer, pipeline, Streamlit app)
        run: python -m pytest -v

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Run business analysis queries
        run: python scripts/run_case_study.py

      - name: Run the evaluation offline (mock provider)
        run: python scripts/run_eval.py --provider mock

      - name: Upload dashboard exports
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/*.csv
