name: Evaluate with an LLM

# Manual run: Actions -> "Evaluate with an LLM" -> Run workflow.
# Needs the repository secret ANTHROPIC_API_KEY (or OPENAI_API_KEY for provider "openai").
# The results are committed to main, so the README table updates by itself.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        type: choice
        options: [anthropic, openai]
        default: anthropic
      model:
        description: "Model (empty = default)"
        required: false
        default: ""

# The run commits its results (eval/results_<provider>.json, docs/eval_results.md, the README table)
permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the warehouse
        run: python run_pipeline.py

      - name: Run the 25-question evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: python scripts/run_eval.py --provider ${{ inputs.provider }}

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add eval/results_*.json docs/eval_results.md README.md
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update evaluation results (${{ inputs.provider }})"
          git push
